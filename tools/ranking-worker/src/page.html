<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PeakMeter Ranking</title>
<meta name="theme-color" content="#05060a">
<link rel="icon" href="https://raw.githubusercontent.com/Peakmeter/PeakMeter/main/docs/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Marcellus+SC&family=Sora:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/site.css?v=2">
<script src="/site.js?v=2"></script>
<style>
  /* The hall of fame: bosses on the left like a dungeon list, the leaderboard as a game window on the right. */
  :root { --edge: var(--line-2); --accent: var(--fb); --silver: #d4dae4; --bronze: #d9a070; }
  .hall { padding-block: 56px 0; }
  .hall-head { text-align: center; margin-bottom: 30px; }
  .hall-head .orn { max-width: 240px; margin: 0 auto 18px; }
  .hall-head h1 { font-size: clamp(42px, 6.4vw, 76px); line-height: 1; }
  .sub { color: var(--dim); max-width: 64ch; margin: 14px auto 0; font-size: 15px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; margin-bottom: 18px; }
  .bar select, .bar button { background: rgba(0,0,0,.35); color: var(--dim); border: 1px solid var(--line-2); border-radius: 4px; padding: 9px 13px;
    font: 600 12.5px/1 var(--hud); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
  .bar select option { background: var(--panel-solid); color: var(--text); text-transform: none; }
  .bar button:hover, .bar select:hover { color: var(--text); }
  .bar button.on { color: var(--fb); border-color: var(--fb); box-shadow: 0 0 14px -4px var(--glow); }
  .sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
  .layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 16px; }
  @media (max-width: 760px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  .card { padding: 12px; min-width: 0; }
  .zone { font: 600 11.5px/1 var(--hud); color: var(--fb); text-transform: uppercase; letter-spacing: .12em; margin: 14px 8px 6px; }
  .zone:first-child { margin-top: 4px; }
  .boss { display: flex; justify-content: space-between; gap: 8px; padding: 9px 10px; border-radius: 4px; cursor: pointer; font-size: 14.5px; border: 1px solid transparent; }
  .boss:hover { background: rgba(255,255,255,.04); }
  .boss.on { background: color-mix(in srgb, var(--fb) 10%, transparent); border-color: color-mix(in srgb, var(--fb) 40%, transparent); color: var(--fb); }
  .boss small { color: var(--mute); font-family: var(--hud); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { text-align: left; font: 600 11.5px/1 var(--hud); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); padding: 10px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 10px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; font-size: 14.5px; }
  td.num, th.num { text-align: right; }
  td.num { font-family: var(--hud); }
  td.rank { width: 40px; font: 700 15px/1 var(--hud); color: var(--mute); }
  tr:nth-child(2) td.rank { color: #ffd76a; text-shadow: 0 0 10px rgba(255,215,106,.5); } tr:nth-child(3) td.rank { color: var(--silver); } tr:nth-child(4) td.rank { color: var(--bronze); }
  tr:nth-child(2) td { background: linear-gradient(90deg, rgba(255,215,106,.08), transparent 60%); }
  .val { font-weight: 700; color: var(--gold); font-size: 15px; }
  .scroll { overflow-x: auto; }
  .empty { color: var(--dim); padding: 30px 8px; text-align: center; }
  .foot { color: var(--mute); font-size: 12.5px; margin-top: 16px; text-align: center; }
  .srv { color: var(--mute); font-size: 12px; font-family: var(--hud); }
  a.pl { color: var(--text); text-decoration: none; border-bottom: 1px solid transparent; }
  a.pl:hover { color: var(--fb); border-bottom-color: var(--fb); }
</style>
</head>
<body>
<nav class="top" data-page="ranking" aria-label="Main"></nav>
<main class="wrap hall">
  <div class="hall-head"><div class="orn"><i></i></div><h1 class="metal" id="hallH">Hall of Fame</h1><p class="sub" id="sub"></p></div>
  <div class="bar">
    <select id="region">
      <option value="eu">Europe</option><option value="nae">NA East</option><option value="naw">NA West</option>
      <option value="kr">Korea</option><option value="tw">Taiwan</option>
    </select>
    <button data-m="dps" class="on">DPS</button>
    <button data-m="hps" id="b-hps"></button>
    <button data-m="stagger">Stagger</button>
    <span class="sep"></span>
    <button data-p="all" id="p-all"></button>
    <button data-p="week" id="p-week"></button>
    <select id="cls"></select>
  </div>
  <div class="layout">
    <div class="card win" id="bosses"></div>
    <div class="card win scroll" id="table"></div>
  </div>
  <div class="foot" id="foot"></div>
</main>
<script>
const de = PM.de;
const T = de ? {
  sub: "Die besten Werte pro Dungeon-Boss. Nur Spieler, die in PeakMeter „Am Ranking teilnehmen“ eingeschaltet haben. Gezählt werden nur Kills, die der Meter von Anfang an gesehen hat.",
  heal: "Heilung", noBoss: "Noch keine Einträge in dieser Region.", pick: "Boss links auswählen.", none: "Noch keine Einträge für diesen Wert.",
  player: "Spieler", cls: "Klasse", time: "Kampfzeit", party: "Gruppe", date: "Datum", err: "Server gerade nicht erreichbar.",
  foot: "Pro Spieler zählt sein bester Kill. Werte pro Sekunde über die ganze Kampfzeit. Die Woche beginnt Montag 0:00 UTC.",
  all: "Allzeit", week: "Diese Woche", allCls: "Alle Klassen", dl: "PeakMeter herunterladen →",
  weekNone: "Diese Woche noch keine Einträge."
} : {
  sub: "The best values per dungeon boss. Only players who turned on “Join the ranking” in PeakMeter. Only kills the meter saw from the start count.",
  heal: "Healing", noBoss: "No entries in this region yet.", pick: "Pick a boss on the left.", none: "No entries for this value yet.",
  player: "Player", cls: "Class", time: "Fight time", party: "Party", date: "Date", err: "Server not reachable right now.",
  foot: "Each player's best kill counts. Values per second over the whole fight. The week starts Monday 0:00 UTC.",
  all: "All time", week: "This week", allCls: "All classes", dl: "Download PeakMeter →",
  weekNone: "No entries this week yet."
};
const CLS_DE = { Gladiator: "Gladiator", Templar: "Templer", Ranger: "Jäger", Assassin: "Assassine", Sorcerer: "Zauberer", Elementalist: "Beschwörer", Cleric: "Kleriker", Chanter: "Kantor", Brawler: "Schläger" };
document.getElementById("sub").textContent = T.sub;
document.getElementById("b-hps").textContent = T.heal;
document.getElementById("foot").textContent = T.foot;
document.getElementById("p-all").textContent = T.all;
document.getElementById("p-week").textContent = T.week;
document.getElementById("hallH").textContent = de ? "Ruhmeshalle" : "Hall of Fame";
const clsSel = document.getElementById("cls");
clsSel.innerHTML = '<option value="">' + T.allCls + "</option>" +
  Object.keys(CLS_DE).map(c => '<option value="' + c + '">' + (de ? CLS_DE[c] : c) + "</option>").join("");

const q = new URLSearchParams(location.search);
const state = { region: q.get("region") || "eu", boss: Number(q.get("boss")) || 0, metric: q.get("metric") || "dps",
  period: q.get("period") === "week" ? "week" : "all", cls: CLS_DE[q.get("cls")] ? q.get("cls") : "" };
clsSel.value = state.cls;
clsSel.onchange = () => { state.cls = clsSel.value; loadTop(); };
document.querySelectorAll("button[data-p]").forEach(b => b.onclick = () => { state.period = b.dataset.p; loadBosses(); });
const regionSel = document.getElementById("region");
regionSel.value = state.region;
regionSel.onchange = () => { state.region = regionSel.value; state.boss = 0; loadBosses(); };
document.querySelectorAll("button[data-m]").forEach(b => b.onclick = () => { state.metric = b.dataset.m; loadTop(); });

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = v => v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : v >= 1e4 ? (v / 1e3).toFixed(1) + "k" : Math.round(v).toLocaleString();
const dur = ms => Math.floor(ms / 60000) + ":" + String(Math.floor(ms / 1000) % 60).padStart(2, "0");
const api = p => fetch(p, { cache: "no-store" }).then(r => { if (!r.ok) throw 0; return r.json(); });
function syncUrl() {
  const p = new URLSearchParams({ region: state.region, metric: state.metric });
  if (state.boss) p.set("boss", state.boss);
  if (state.period === "week") p.set("period", "week");
  if (state.cls) p.set("cls", state.cls);
  history.replaceState(null, "", "?" + p);
}

async function loadBosses() {
  const el = document.getElementById("bosses");
  let list;
  document.querySelectorAll("button[data-p]").forEach(b => b.classList.toggle("on", b.dataset.p === state.period));
  try { list = await api("/api/bosses?region=" + state.region + "&period=" + state.period); } catch { el.innerHTML = '<div class="empty">' + T.err + "</div>"; return; }
  if (!list.length) { el.innerHTML = '<div class="empty">' + (state.period === "week" ? T.weekNone : T.noBoss) + "</div>"; document.getElementById("table").innerHTML = ""; syncUrl(); return; }
  if (!list.some(b => b.boss === state.boss)) state.boss = list[0].boss;
  let html = "", zone = null;
  for (const b of list) {
    if (b.zone !== zone) { zone = b.zone; html += '<div class="zone">' + esc(zone || "Dungeon") + "</div>"; }
    html += '<div class="boss' + (b.boss === state.boss ? " on" : "") + '" data-b="' + b.boss + '"><span>' + esc(b.name) + "</span><small>" + b.players + "</small></div>";
  }
  el.innerHTML = html;
  el.querySelectorAll(".boss").forEach(d => d.onclick = () => {
    state.boss = Number(d.dataset.b);
    el.querySelectorAll(".boss").forEach(x => x.classList.toggle("on", x === d));
    loadTop();
  });
  loadTop();
}

async function loadTop() {
  document.querySelectorAll("button[data-m]").forEach(b => b.classList.toggle("on", b.dataset.m === state.metric));
  syncUrl();
  const el = document.getElementById("table");
  if (!state.boss) { el.innerHTML = '<div class="empty">' + T.pick + "</div>"; return; }
  let rows;
  try { rows = await api("/api/top?region=" + state.region + "&boss=" + state.boss + "&metric=" + state.metric + "&period=" + state.period +
    (state.cls ? "&cls=" + state.cls : "") + "&limit=100"); }
  catch { el.innerHTML = '<div class="empty">' + T.err + "</div>"; return; }
  if (!rows.length) { el.innerHTML = '<div class="empty">' + T.none + "</div>"; return; }
  const head = state.metric === "dps" ? "DPS" : state.metric === "hps" ? T.heal + "/s" : "Stagger/s";
  let html = "<table><tr><th>#</th><th>" + T.player + "</th><th>" + T.cls + '</th><th class="num">CP</th><th class="num">' + head +
    '</th><th class="num">' + T.time + '</th><th class="num">' + T.party + '</th><th class="num">' + T.date + "</th></tr>";
  rows.forEach((r, i) => {
    const cls = r.cls ? (de ? CLS_DE[r.cls] || r.cls : r.cls) : "";
    const prof = r.server ? "/player/" + state.region + "/" + encodeURIComponent(r.server) + "/" + encodeURIComponent(r.name) : null;
    html += '<tr><td class="rank">' + (i + 1) + "</td><td>" + (prof ? '<a class="pl" href="' + prof + '">' + esc(r.name) + "</a>" : esc(r.name)) + (r.server ? ' <span class="srv">' + esc(r.server) + "</span>" : "") +
      "</td><td>" + esc(cls) + '</td><td class="num">' + (r.cp ? r.cp.toLocaleString() : "") + '</td><td class="num val">' + fmt(r.value) +
      '</td><td class="num">' + (r.durMs ? dur(r.durMs) : "") + '</td><td class="num">' + (r.party || "") +
      '</td><td class="num">' + new Date(r.at).toLocaleDateString(de ? "de-DE" : undefined) + "</td></tr>";
  });
  el.innerHTML = html + "</table>";
}
loadBosses();
</script>
</body>
</html>
